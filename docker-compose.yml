# RE_OS — Real Estate Intelligence OS
# Multi-agent system: PostgreSQL+PostGIS | Ollama | Redis | Agent Crew | Prometheus | Grafana
# Boot: docker compose up -d   (7 containers)

# ── SHARED ENVIRONMENT (applied to both agents + scheduler) ───────────────────
x-agent-env: &agent-env
  DATABASE_URL: postgresql://re_os_user:${DB_PASSWORD}@postgres:5432/re_os
  OLLAMA_BASE_URL: http://ollama:11434
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
  CEREBRAS_MODEL: ${CEREBRAS_MODEL:-gpt-oss-120b}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  TARGET_MARKETS: ${TARGET_MARKETS:-Yelahanka,Devanahalli,Hebbal}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:-}
  DASHBOARD_API_KEY_PREV: ${DASHBOARD_API_KEY_PREV:-}
  DASHBOARD_ALLOWED_ORIGINS: ${DASHBOARD_ALLOWED_ORIGINS:-http://localhost:8050}
  DISCORD_WEBHOOK_RERA_YELAHANKA: ${DISCORD_WEBHOOK_RERA_YELAHANKA:-}
  DISCORD_WEBHOOK_RERA_DEVANAHALLI: ${DISCORD_WEBHOOK_RERA_DEVANAHALLI:-}
  DISCORD_WEBHOOK_RERA_HEBBAL: ${DISCORD_WEBHOOK_RERA_HEBBAL:-}
  DISCORD_WEBHOOK_COMPETITOR: ${DISCORD_WEBHOOK_COMPETITOR:-}
  DISCORD_WEBHOOK_PRICE: ${DISCORD_WEBHOOK_PRICE:-}
  DISCORD_WEBHOOK_INTEL: ${DISCORD_WEBHOOK_INTEL:-}
  DISCORD_WEBHOOK_SYSTEM: ${DISCORD_WEBHOOK_SYSTEM:-}
  DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
  DISCORD_WEBHOOK_BD_OPPORTUNITIES: ${DISCORD_WEBHOOK_BD_OPPORTUNITIES:-}
  SAMBANOVA_API_KEY: ${SAMBANOVA_API_KEY:-}
  CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:-}
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  JINA_API_KEY: ${JINA_API_KEY:-}
  HF_API_KEY: ${HF_API_KEY:-}
  CHROMA_DB_PATH: /app/data/chroma

# ── SHARED VOLUMES (applied to both agents + scheduler) ───────────────────────
x-agent-volumes: &agent-volumes
  - ./:/app
  - re_os_outputs:/app/outputs
  - re_os_logs:/app/logs
  - hf_cache:/root/.cache/huggingface
  - chroma_data:/app/data/chroma
  - ./backups:/backups
  # Obsidian sync: mount your local vault in docker-compose.override.yml — not here
  # Example: - "/path/to/your/obsidian/markets:/app/obsidian_sync"

services:

  # ── DATABASE ──────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.3
    container_name: re_os_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: re_os
      POSTGRES_USER: re_os_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    # Port intentionally not published — access via: docker compose exec postgres psql -U re_os_user -d re_os
    # Or: make db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U re_os_user -d re_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── LOCAL LLM ENGINE ──────────────────────────────────────────────────────
  # Powers: Parser Agent, Organizer Agent, Analyst Agent (free, local)
  ollama:
    image: ollama/ollama:latest
    container_name: re_os_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/app/models:ro
    # Port not published — agents communicate via internal Docker network (http://ollama:11434)
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 2G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── TASK QUEUE ────────────────────────────────────────────────────────────
  # Agents communicate via Redis — CEO pushes tasks, workers consume
  redis:
    image: redis:7-alpine
    container_name: re_os_redis
    restart: unless-stopped
    # Port not published — agents communicate via internal Docker network (redis://redis:6379)
    # Used by: Flask-Limiter rate limiting (agents), APScheduler job store (scheduler)
    environment:
      # REDISCLI_AUTH: env-var auth avoids exposing password in /proc/*/cmdline via -a flag
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── AGENT CREW ────────────────────────────────────────────────────────────
  # The multi-agent team: CEO + Scraper + Parser + Organizer + Analyst
  agents:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: re_os_agents
    user: re_os
    restart: unless-stopped
    environment:
      <<: *agent-env
    ports:
      - "8050:8050"
    volumes: *agent-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8050/api/health/live', timeout=5)\" 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    command:
      - sh
      - -c
      - alembic upgrade head && python -c "from agents.agent_factory import sync_registry_to_db; sync_registry_to_db()" && exec uvicorn dashboard.app_fastapi:app --host 0.0.0.0 --port 8050 --workers 2 --log-level info

  # ── SCHEDULER v2 ──────────────────────────────────────────────────────────
  # Isolated scheduler container — separate from agents (prevents silent-death
  # incidents where a scheduler hang blocks the FastAPI process).
  # NOTE: Renamed from `re_os_scheduler` (old `scheduler:` service). Run
  # `docker compose up -d --remove-orphans` to clean up the old container.
  scheduler_v2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: re_os_scheduler_v2
    user: re_os
    restart: unless-stopped
    environment:
      <<: *agent-env
      SCHEDULER_DRY_RUN: "false"
    volumes: *agent-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.0"
        reservations:
          memory: 512M
    healthcheck:
      # Two-stage check: (1) module importable (code is valid), (2) scheduler process alive
      # via heartbeat table row (written every 30min by run_scheduler_heartbeat).
      # Falls back to module import check if DB is unreachable (startup race).
      test: ["CMD-SHELL", "python -c \"from config.scheduler import start_scheduler; print('module ok')\" 2>/dev/null && python -c \"from utils.db import get_engine; from sqlalchemy import text; r=get_engine().execute(text(\\\"SELECT 1 FROM agent_runs WHERE agent_name='scheduler_heartbeat' AND created_at > NOW()-INTERVAL '90 minutes' LIMIT 1\\\")).fetchone(); exit(0 if r else 1)\" 2>/dev/null || python -c \"from config.scheduler import start_scheduler; print('degraded')\""]
      interval: 120s
      timeout: 15s
      retries: 3
      start_period: 60s
    command: python -m config.scheduler

  # ── METRICS COLLECTION ────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: re_os_prometheus
    restart: unless-stopped
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    # Port not published — Grafana accesses via internal network (http://re_os_prometheus:9090)
    depends_on:
      - agents

  # ── DASHBOARDS ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: re_os_grafana
    restart: unless-stopped
    environment:
      # Anonymous access: read-only viewer (not admin — security hardening)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-re_os_admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  ollama_data:
  redis_data:
  re_os_outputs:
  re_os_logs:
  hf_cache:
  chroma_data:
  prometheus_data:
  grafana_data:
  # re_os_backups: removed — replaced by bind mount ./backups:/backups (Sprint 83)