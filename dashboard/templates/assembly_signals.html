<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net https://api.github.com;">
<title>Assembly Signals — LLS</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"
        integrity="sha384-QSs4R2WQYfCQCiJAD5cQ1M6lqI0Hq2N5jn0gOQ7nhSO4lBfFiINYHGxhC1+3KFQ"
        crossorigin="anonymous"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0e1a; color: #c9d1d9;
  font-family: 'Courier New', Courier, monospace; font-size: 14px;
  min-height: 100vh; padding: 20px;
}
h1 { color: #58a6ff; font-size: 18px; margin-bottom: 4px; letter-spacing: 1px; }
.subtitle { color: #6b7280; font-size: 11px; margin-bottom: 20px; }
.panel {
  background: #0f1520; border: 1px solid #2a3a55;
  padding: 16px; margin-bottom: 16px; max-width: 1400px;
}
.filter-bar {
  display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;
  margin-bottom: 20px;
}
.filter-group {
  display: flex; flex-direction: column; gap: 4px;
}
.filter-group label {
  font-size: 9px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px;
}
.filter-group select {
  background: #0a0e1a; border: 1px solid #2a3a55; color: #c9d1d9;
  padding: 6px 8px; font-family: 'Courier New', monospace; font-size: 12px;
  border-radius: 4px; min-width: 160px;
}
.filter-group select:focus { outline: none; border-color: #58a6ff; }
.stats-row {
  display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px;
}
.stat-card {
  background: #161b2e; border: 1px solid #2a3a55;
  padding: 12px 16px; min-width: 120px;
}
.stat-card .label { font-size: 9px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
.stat-card .value { font-size: 18px; color: #f0a020; margin-top: 2px; }
.stat-card .value.green { color: #3fb950; }
.stat-card .value.red { color: #f85149; }
.stat-card .value.amber { color: #f0a020; }
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; padding: 8px 12px; border-bottom: 1px solid #2a3a55;
  color: #8b949e; font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
  position: sticky; top: 0; background: #0f1520; z-index: 1;
}
td {
  padding: 8px 12px; border-bottom: 1px solid #1a2540; font-size: 12px;
  max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
tr:hover td { background: #1a2540; }
tr.expandable { cursor: pointer; }
tr.expandable td:first-child::before { content: '\25B6'; color: #6b7280; margin-right: 6px; font-size: 10px; }
tr.expanded td:first-child::before { content: '\25BC'; }
tr.detail-row td { background: #0a0e1a; padding: 12px 16px 12px 32px; }
tr.detail-row td { color: #8b949e; font-size: 12px; line-height: 1.6; }
.confidence-badge {
  display: inline-block; padding: 2px 8px; border-radius: 3px;
  font-size: 11px; font-weight: bold;
}
.confidence-badge.actionable { background: #0f2a0f; color: #3fb950; }
.confidence-badge.high { background: #0f2a0f; color: #3fb950; }
.confidence-badge.medium { background: #2a1f0f; color: #f0a020; }
.confidence-badge.low { background: #1a1a2a; color: #8b949e; }
.telegram-badge {
  display: inline-flex; align-items: center; gap: 2px;
  font-size: 10px; color: #3fb950;
  cursor: help;
}
.days-stale { color: #484f58; font-style: italic; }
.survey-list { font-size: 11px; color: #6b7280; max-height: 80px; overflow-y: auto; }
.spinner { display: none; color: #8b949e; font-size: 13px; padding: 20px; text-align: center; }
.spinner.active { display: block; }
.error-msg { color: #f85149; font-size: 12px; padding: 16px; text-align: center; }
.error-msg button { background: #3a1a1a; border: 1px solid #f85149; color: #f85149; padding: 4px 12px; font-family: inherit; font-size: 11px; cursor: pointer; border-radius: 4px; margin-top: 8px; }
.empty-msg { color: #484f58; font-size: 12px; padding: 20px; text-align: center; font-style: italic; }
.toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a3a55; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #3a5a85; }
</style>
</head>
<body>

<h1>ASSEMBLY SIGNALS</h1>
<div class="subtitle" id="last-updated">Loading...</div>

<div class="toolbar">
  <button id="refresh-btn" style="background:#161b2e;border:1px solid #2a3a55;color:#8b949e;padding:6px 12px;font-family:inherit;font-size:11px;cursor:pointer;border-radius:4px;">⟳ Refresh</button>
  <button id="timeline-toggle-btn" style="background:#161b2e;border:1px solid #2a3a55;color:#8b949e;padding:6px 12px;font-family:inherit;font-size:11px;cursor:pointer;border-radius:4px;">📈 Timeline</button>
</div>

<div class="panel">
  <div class="filter-bar">
    <div class="filter-group">
      <label for="market-filter">Market</label>
      <select id="market-filter">
        <option value="">All Markets</option>
        <option value="Yelahanka">Yelahanka</option>
        <option value="Devanahalli">Devanahalli</option>
        <option value="Hebbal">Hebbal</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="min-conf-filter">Min Confidence</label>
      <select id="min-conf-filter">
        <option value="0">All</option>
        <option value="0.75" selected>High (≥75%)</option>
        <option value="0.5">Medium+ (≥50%)</option>
      </select>
    </div>
  </div>

    <div class="stats-row">
    <div class="stat-card">
      <div class="label">Active Signals</div>
      <div class="value" id="stat-total">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Actionable</div>
      <div class="value green" id="stat-high">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Medium</div>
      <div class="value amber" id="stat-medium">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Watch</div>
      <div class="value" id="stat-watch">—</div>
    </div>
  </div>

  <div style="max-height:500px;overflow-y:auto;border:1px solid #1a2540;border-radius:4px;">
    <table id="signal-table">
      <thead>
        <tr>
          <th>Buyer</th>
          <th>Village</th>
          <th>Market</th>
          <th>Parcels</th>
          <th style="text-align:right;">Area (sqm)</th>
          <th style="text-align:center;">Confidence</th>
          <th style="text-align:right;">Days</th>
          <th style="text-align:center;">Tel</th>
        </tr>
      </thead>
      <tbody id="signal-tbody">
        <tr><td colspan="8" class="empty-msg">Loading assembly signals...</td></tr>
      </tbody>
    </table>
  </div>
  <div class="detail-area" id="detail-area" style="display:none;margin-top:12px;padding:12px;background:#0a0e1a;border:1px solid #1a2540;border-radius:4px;"></div>
</div>

<div class="panel" id="timeline-panel" style="display:none;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <span style="color:#8b949e;font-size:10px;text-transform:uppercase;letter-spacing:1px;">Assembly Timeline (6-month rolling windows)</span>
    <span style="color:#6b7280;font-size:10px;" id="timeline-summary"></span>
  </div>
  <div id="timeline-spinner" style="display:none;color:#2a3a55;font-size:12px;text-align:center;padding:12px;">⟳ Loading timeline...</div>
  <div style="position:relative;width:100%;height:240px;">
    <canvas id="assemblyTimeline" style="width:100%;height:100%;"></canvas>
  </div>
  <div id="timeline-error" style="display:none;color:#f85149;font-size:12px;text-align:center;padding:12px;">
    <span id="timeline-error-text">Failed to load timeline</span>
    <button onclick="loadTimeline()" style="background:#3a1a1a;border:1px solid #f85149;color:#f85149;padding:4px 12px;font-family:inherit;font-size:11px;cursor:pointer;border-radius:4px;margin-left:8px;">Retry</button>
  </div>
</div>

<div class="spinner" id="spinner">⟳ Loading...</div>
<div class="error-msg" id="error-msg" style="display:none;"></div>

<script>
"use strict";

let expandedIndex = -1;
let signalData = [];
let autoRefreshTimer = null;
let timelineChart = null;
const AUTO_REFRESH_MS = 60000;

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;", '"': '&quot;'
  })[ch]);
}

function getConfidenceClass(score) {
  if (score >= 0.75) return 'actionable';
  if (score >= 0.5) return 'medium';
  return 'low';
}

function getDaysClass(days) {
  if (days > 60) return 'days-stale';
  return '';
}

function formatArea(sqm) {
  if (!sqm || isNaN(sqm)) return '\u2014';
  if (sqm >= 10000) return (sqm / 10000).toFixed(2) + ' ha';
  return sqm.toLocaleString('en-IN', { maximumFractionDigits: 0 }) + ' sqm';
}

function startAutoRefresh() {
  stopAutoRefresh();
  autoRefreshTimer = setInterval(loadSignals, AUTO_REFRESH_MS);
}

function stopAutoRefresh() {
  if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
}

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('market-filter').addEventListener('change', function() {
    expandedIndex = -1; loadSignals();
    if (document.getElementById('timeline-panel').style.display !== 'none') { loadTimeline(); }
  });
  document.getElementById('min-conf-filter').addEventListener('change', function() { expandedIndex = -1; loadSignals(); });
  document.getElementById('refresh-btn').addEventListener('click', function() { loadSignals(); });
  document.getElementById('timeline-toggle-btn').addEventListener('click', function() {
    const panel = document.getElementById('timeline-panel');
    if (panel.style.display === 'none') {
      panel.style.display = 'block';
      loadTimeline();
    } else {
      panel.style.display = 'none';
    }
  });
  loadSignals();
  startAutoRefresh();
});

async function loadSignals() {
  const tbody = document.getElementById('signal-tbody');
  const spinner = document.getElementById('spinner');
  const errorMsg = document.getElementById('error-msg');
  const detailArea = document.getElementById('detail-area');

  spinner.classList.add('active');
  errorMsg.style.display = 'none';
  detailArea.style.display = 'none';
  tbody.innerHTML = '<tr><td colspan="8" style="padding:8px 12px;color:#2a3a55;text-align:center;">⟳ Loading...</td></tr>';

  const market = document.getElementById('market-filter').value;
  const minConf = document.getElementById('min-conf-filter').value;

  const params = new URLSearchParams();
  params.set('min_confidence', minConf || '0');
  if (market) params.set('market', market);

  try {
    const resp = await fetch('/api/v1/intel/assembly-alerts?' + params.toString());
    spinner.classList.remove('active');
    if (!resp.ok) {
      errorMsg.innerHTML = 'Failed to load (HTTP ' + resp.status + ')<br><button onclick="loadSignals()">Retry</button>';
      errorMsg.style.display = 'block';
      tbody.innerHTML = '<tr><td colspan="8" class="empty-msg">Error loading</td></tr>';
      return;
    }

    const data = await resp.json();
    signalData = data.alerts || [];
    const count = data.count || 0;

    let highCount = 0, medCount = 0, watchCount = 0;
    signalData.forEach(function(a) {
      const c = parseFloat(a.confidence_score || 0);
      if (c >= 0.75) highCount++;
      else if (c >= 0.5) medCount++;
      else watchCount++;
    });

    document.getElementById('stat-total').textContent = count;
    document.getElementById('stat-high').textContent = highCount;
    document.getElementById('stat-medium').textContent = medCount;
    document.getElementById('stat-watch').textContent = watchCount;

    document.getElementById('last-updated').textContent = 'Last updated: ' + new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', hour12: false }) + ' IST';

    if (!signalData.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty-msg">No active assembly signals — deed throughput too low to detect patterns. Add Form 17 PDFs to data/kaveri_deeds/inbox/form17/</td></tr>';
      return;
    }

    tbody.innerHTML = signalData.map(function(a, idx) {
      try {
        const conf = parseFloat(a.confidence_score || 0);
        const confClass = getConfidenceClass(conf);
        const buyer = escapeHtml(a.buyer_name || '\u2014');
        const village = escapeHtml(a.village || '\u2014');
        const marketDisplay = escapeHtml(a.market || '\u2014');
        const parcels = a.parcel_count || 0;
        const areaSqm = parseFloat(a.area_sqm || 0);
        const areaFormatted = formatArea(areaSqm);
        const days = a.days_active || 0;
        const hasTelegram = conf >= 0.75;
        const isExpanded = expandedIndex === idx;
        const daysClass = getDaysClass(days);
        const surveyStr = a.survey_numbers && Array.isArray(a.survey_numbers)
          ? escapeHtml(a.survey_numbers.join(', ')) : '';

        return '<tr class="expandable' + (isExpanded ? ' expanded' : '') + '" onclick="toggleDetail(' + idx + ')">'
          + '<td style="color:#c9d1d9;">' + buyer + '</td>'
          + '<td style="color:#8b949e;">' + village + '</td>'
          + '<td style="color:#6b7280;">' + marketDisplay + '</td>'
          + '<td style="color:#c9d1d9;">' + parcels + '</td>'
          + '<td style="text-align:right;color:#6b7280;">' + areaFormatted + '</td>'
          + '<td style="text-align:center;"><span class="confidence-badge ' + confClass + '">' + (conf * 100).toFixed(0) + '%</span></td>'
          + '<td style="text-align:right;color:#6b7280;" class="' + daysClass + '">' + days + 'd</td>'
          + '<td style="text-align:center;">' + (hasTelegram ? '<span class="telegram-badge" title="Telegram alert sent">\uD83D\uDD14</span>' : '') + '</td>'
          + '</tr>'
          + (isExpanded ? '<tr class="detail-row"><td colspan="8"><strong>Survey Numbers:</strong> ' + (surveyStr || 'N/A') + '<br><strong>First Deed:</strong> ' + escapeHtml(a.first_txn_date || 'N/A') + ' | <strong>Detected:</strong> ' + escapeHtml(a.detected_at || 'N/A') + '<br><strong>Day Range:</strong> ' + days + ' days active</td></tr>' : '');
      } catch (rowErr) {
        return '<tr><td colspan="8" style="color:#f85149;padding:8px 12px;">Error: ' + escapeHtml(rowErr.message) + '</td></tr>';
      }
    }).join('');

  } catch (e) {
    spinner.classList.remove('active');
    errorMsg.innerHTML = 'Network error: ' + escapeHtml(e.message) + '<br><button onclick="loadSignals()">Retry</button>';
    errorMsg.style.display = 'block';
    tbody.innerHTML = '<tr><td colspan="8" class="empty-msg">Failed to load</td></tr>';
  }
}

function toggleDetail(idx) {
  expandedIndex = expandedIndex === idx ? -1 : idx;
  loadSignals();
}

let lastTimelineMarket = '';

async function loadTimeline() {
  const canvas = document.getElementById('assemblyTimeline');
  const summary = document.getElementById('timeline-summary');
  const spinner = document.getElementById('timeline-spinner');
  const errorDiv = document.getElementById('timeline-error');
  const errorText = document.getElementById('timeline-error-text');
  const market = document.getElementById('market-filter').value || 'Yelahanka';

  if (market === lastTimelineMarket && timelineChart) { return; }
  lastTimelineMarket = market;

  errorDiv.style.display = 'none';
  spinner.style.display = 'block';
  summary.textContent = '';

  try {
    const resp = await fetch('/api/v1/intel/assembly-timeline?market=' + encodeURIComponent(market));
    spinner.style.display = 'none';
    if (!resp.ok) {
      errorText.textContent = 'Failed to load (HTTP ' + resp.status + ')';
      errorDiv.style.display = 'block';
      return;
    }
    const data = await resp.json();
    const timeline = data.timeline || [];

    if (!timeline.length) {
      summary.textContent = 'No time-series data for ' + market;
      if (timelineChart) { timelineChart.destroy(); timelineChart = null; }
      return;
    }

    const labels = timeline.map(function(t) { return t.week_start; });
    const clusterCounts = timeline.map(function(t) { return t.cluster_count; });
    const highConfCounts = timeline.map(function(t) { return t.high_confidence_count; });
    const totalClusters = clusterCounts.reduce(function(a, b) { return a + b; }, 0);
    summary.textContent = market + ' — ' + totalClusters + ' clusters, ' + timeline.length + ' weeks';

    if (timelineChart) { timelineChart.destroy(); }

    timelineChart = new Chart(canvas, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Cluster Count',
          data: clusterCounts,
          borderColor: '#3fb950',
          backgroundColor: 'rgba(63,185,80,0.08)',
          fill: true,
          tension: 0.3,
          pointRadius: 3,
          pointHoverRadius: 6,
          pointHoverBackgroundColor: '#3fb950',
        }, {
          label: 'High Confidence',
          data: highConfCounts,
          borderColor: '#f0a020',
          backgroundColor: 'rgba(240,160,32,0.08)',
          fill: true,
          tension: 0.3,
          pointRadius: 3,
          pointHoverRadius: 6,
          pointHoverBackgroundColor: '#f0a020',
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: {
            labels: { color: '#8b949e', font: { size: 11 }, usePointStyle: true, padding: 16 }
          },
          tooltip: {
            backgroundColor: '#0f1520',
            titleColor: '#c9d1d9',
            bodyColor: '#8b949e',
            borderColor: '#2a3a55',
            borderWidth: 1,
            padding: 10,
            cornerRadius: 4,
            callbacks: {
              title: function(items) {
                return 'Week: ' + items[0].label;
              }
            }
          }
        },
        scales: {
          x: {
            ticks: {
              color: '#6b7280', font: { size: 9 },
              maxTicksLimit: 12, maxRotation: 45
            },
            grid: { color: '#1a2540', drawBorder: false }
          },
          y: {
            beginAtZero: true,
            ticks: { color: '#6b7280', font: { size: 9 }, stepSize: 1, precision: 0 },
            grid: { color: '#1a2540', drawBorder: false }
          }
        }
      }
    });
  } catch (e) {
    spinner.style.display = 'none';
    errorText.textContent = 'Network error: ' + e.message;
    errorDiv.style.display = 'block';
  }
}
</script>
</body>
</html>
