<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
<title>Deed Throughput — LLS</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0e1a; color: #c9d1d9;
  font-family: 'Courier New', Courier, monospace; font-size: 14px;
  min-height: 100vh; padding: 20px;
}
h1 { color: #58a6ff; font-size: 18px; margin-bottom: 4px; letter-spacing: 1px; }
.subtitle { color: #6b7280; font-size: 11px; margin-bottom: 20px; }
.panel {
  background: #0f1520; border: 1px solid #2a3a55;
  padding: 16px; margin-bottom: 16px; max-width: 1400px;
}
.stats-row {
  display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px;
}
.stat-card {
  background: #161b2e; border: 1px solid #2a3a55;
  padding: 12px 16px; min-width: 140px; flex: 1;
}
.stat-card .label { font-size: 9px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
.stat-card .value { font-size: 22px; color: #f0a020; margin-top: 2px; }
.stat-card .value.green { color: #3fb950; }
.stat-card .value.red { color: #f85149; }
.stat-card .value.amber { color: #f0a020; }
.deadline-countdown {
  text-align: center; padding: 24px; margin-bottom: 20px;
  background: #161b2e; border: 2px solid #2a3a55; border-radius: 8px;
}
.deadline-countdown .days { font-size: 48px; font-weight: bold; color: #58a6ff; }
.deadline-countdown .label { font-size: 11px; color: #8b949e; margin-top: 4px; }
.deadline-countdown .deadline { font-size: 12px; color: #6b7280; margin-top: 8px; }
.status-badge {
  display: inline-block; padding: 4px 16px; border-radius: 4px;
  font-size: 13px; font-weight: bold; margin: 8px 0;
}
.status-badge.on-track { background: #0f2a0f; color: #3fb950; }
.status-badge.at-risk { background: #2a1f0f; color: #f0a020; }
.status-badge.critical { background: #2a0f0f; color: #f85149; }
.chart-container {
  margin: 20px 0;
}
.chart-container svg { width: 100%; height: auto; }
.bar { fill: #58a6ff; }
.bar:hover { fill: #79b8ff; }
.bar-label { font-size: 9px; fill: #8b949e; text-anchor: middle; }
.target-line { stroke: #f85149; stroke-width: 1; stroke-dasharray: 4 2; }
.axis-label { font-size: 9px; fill: #6b7280; }
.market-selector { margin-bottom: 16px; }
.market-selector select {
  background: #0a0e1a; border: 1px solid #2a3a55; color: #c9d1d9;
  padding: 6px 8px; font-family: 'Courier New', monospace; font-size: 12px;
  border-radius: 4px; min-width: 160px;
}
.market-selector select:focus { outline: none; border-color: #58a6ff; }
.empty-msg { color: #484f58; font-size: 12px; padding: 20px; text-align: center; font-style: italic; }
.error-msg { color: #f85149; font-size: 12px; padding: 16px; text-align: center; }
.error-msg button { background: #3a1a1a; border: 1px solid #f85149; color: #f85149; padding: 4px 12px; font-family: inherit; font-size: 11px; cursor: pointer; border-radius: 4px; margin-top: 8px; }
.spinner { display: none; color: #8b949e; font-size: 13px; padding: 20px; text-align: center; }
.spinner.active { display: block; }
.toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a3a55; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #3a5a85; }
</style>
</head>
<body>

<h1>DEED THROUGHPUT</h1>
<div class="subtitle" id="last-updated">Loading...</div>

<div class="toolbar">
  <button id="refresh-btn" style="background:#161b2e;border:1px solid #2a3a55;color:#8b949e;padding:6px 12px;font-family:inherit;font-size:11px;cursor:pointer;border-radius:4px;" aria-label="Refresh data">⟳ Refresh</button>
  <span style="font-size:10px;color:#484f58;margin-left:8px;" id="connection-status"></span>
</div>

<div class="panel">
  <div class="market-selector">
    <select id="market-filter">
      <option value="">All Markets</option>
      <option value="Yelahanka">Yelahanka</option>
      <option value="Devanahalli">Devanahalli</option>
      <option value="Hebbal">Hebbal</option>
    </select>
  </div>

  <div class="deadline-countdown" id="countdown-section">
    <div class="label">Days Until Kill Criteria Deadline</div>
    <div class="days" id="days-remaining">—</div>
    <div class="deadline">Deadline: 2026-08-15 <span id="deadline-status"></span></div>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="label">Current Week</div>
      <div class="value" id="stat-current">—</div>
    </div>
    <div class="stat-card">
      <div class="label">4-Week Avg</div>
      <div class="value" id="stat-4wk-avg">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Target</div>
      <div class="value" id="stat-target">50/wk</div>
    </div>
    <div class="stat-card">
      <div class="label">Status</div>
      <div id="stat-status"><span class="status-badge" id="status-badge">—</span></div>
    </div>
  </div>

  <div class="chart-container" id="chart-container">
    <h3 style="color:#8b949e;font-size:11px;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px;">Weekly Deed Count (12 weeks)</h3>
    <div id="sparkline-svg"><p class="empty-msg">Loading chart...</p></div>
  </div>
</div>

<div class="spinner" id="spinner">⟳ Loading...</div>
<div class="error-msg" id="error-msg" style="display:none;"></div>

<script>
"use strict";

const DEADLINE = new Date('2026-08-15T00:00:00+05:30');
const TARGET = 50;
const STATUS_MAP = { on_track: 'on-track', at_risk: 'at-risk', critical: 'critical' };
let autoRefreshTimer = null;
const AUTO_REFRESH_MS = 60000;

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  })[ch]);
}

function getDeadlineUrgency(days) {
  if (days <= 30) return 'critical';
  if (days <= 60) return 'at-risk';
  return 'on-track';
}

function startAutoRefresh() {
  stopAutoRefresh();
  autoRefreshTimer = setInterval(loadThroughput, AUTO_REFRESH_MS);
}

function stopAutoRefresh() {
  if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
}

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('market-filter').addEventListener('change', function() { loadThroughput(); });
  document.getElementById('refresh-btn').addEventListener('click', function() { loadThroughput(); });
  loadThroughput();
  startAutoRefresh();
});

function computeDaysRemaining() {
  const now = new Date();
  const diff = DEADLINE.getTime() - now.getTime();
  return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
}

async function loadThroughput() {
  const spinner = document.getElementById('spinner');
  const errorMsg = document.getElementById('error-msg');

  spinner.classList.add('active');
  errorMsg.style.display = 'none';

  const market = document.getElementById('market-filter').value;
  const params = new URLSearchParams();
  if (market) params.set('market', market);

  try {
    const resp = await fetch('/api/v1/deeds/throughput?' + params.toString());
    spinner.classList.remove('active');
    if (!resp.ok) {
      errorMsg.innerHTML = 'Failed to load (HTTP ' + resp.status + ')<br><button onclick="loadThroughput()">Retry</button>';
      errorMsg.style.display = 'block';
      return;
    }

    const data = await resp.json();
    const weeks = data.weeks || [];
    const currentCount = data.current_week_count || 0;
    const status = data.status || 'critical';

    const daysRemaining = computeDaysRemaining();
    document.getElementById('days-remaining').textContent = daysRemaining;

    const urgency = getDeadlineUrgency(daysRemaining);
    document.getElementById('deadline-status').textContent = urgency.toUpperCase();
    document.getElementById('deadline-status').style.color = urgency === 'critical' ? '#f85149' : urgency === 'at-risk' ? '#f0a020' : '#3fb950';

    const last4Weeks = weeks.slice(0, 4);
    const totalDeeds4 = last4Weeks.reduce(function(sum, w) { return sum + w.deed_count; }, 0);
    const avg4wk = last4Weeks.length > 0 ? (totalDeeds4 / 4) : 0;

    document.getElementById('stat-current').textContent = currentCount;
    document.getElementById('stat-4wk-avg').textContent = avg4wk.toFixed(1);

    const statusEl = document.getElementById('status-badge');
    statusEl.textContent = status.toUpperCase().replace(/_/g, ' ');
    statusEl.className = 'status-badge ' + (STATUS_MAP[status] || 'critical');

    document.getElementById('last-updated').textContent = 'Last updated: ' + new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', hour12: false }) + ' IST';

    const svg = renderSparkline(weeks, TARGET);
    document.getElementById('sparkline-svg').innerHTML = svg;

    if (document.getElementById('connection-status')) document.getElementById('connection-status').textContent = '';

  } catch (e) {
    spinner.classList.remove('active');
    const isOffline = typeof navigator !== 'undefined' && !navigator.onLine;
    const msg = isOffline ? 'Browser is offline' : 'Server unreachable: ' + escapeHtml(e.message);
    errorMsg.innerHTML = msg + '<br><button onclick="loadThroughput()">Retry</button>';
    errorMsg.style.display = 'block';
    const cs = document.getElementById('connection-status');
    if (cs) cs.textContent = isOffline ? '\u26A0 OFFLINE' : '\u26A0 ERROR';
  }
}

function renderSparkline(weeks, target) {
  if (!weeks || weeks.length === 0) {
    return '<p class="empty-msg">No deed data available</p>';
  }

  const W = 700, H = 200, PAD = 40;
  const chartW = W - PAD * 2;
  const chartH = H - PAD * 2;
  const dataMax = Math.max.apply(null, weeks.map(function(w) { return w.deed_count; }));
  const maxVal = Math.max(target, dataMax, 1);
  const barCount = weeks.length;
  const barW = Math.max(8, Math.min(28, (chartW - 20) / barCount - 4));
  const gap = Math.max(2, Math.min(6, (chartW - 20) / barCount * 0.15));

  const bars = weeks.map(function(w, i) {
    const x = PAD + i * (barW + gap) + gap / 2;
    const h = (w.deed_count / maxVal) * chartH;
    const y = PAD + chartH - h;
    const color = w.deed_count >= target ? '#3fb950' : w.deed_count >= target * 0.5 ? '#f0a020' : '#f85149';
    return { x: x, y: y, w: barW, h: h, count: w.deed_count, week: w.week_start || '', color: color };
  });

  const targetY = PAD + chartH - (target / maxVal) * chartH;
  const labelX = bars.length > 0 ? bars[bars.length - 1].x + barW + 6 : PAD + chartW + 4;

  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
  svg += '<line x1="' + PAD + '" y1="' + targetY + '" x2="' + (PAD + chartW) + '" y2="' + targetY + '" class="target-line" />';
  svg += '<text x="' + labelX + '" y="' + (targetY + 3) + '" class="axis-label">Target: ' + target + '</text>';

  bars.forEach(function(b) {
    svg += '<rect class="bar" x="' + b.x + '" y="' + b.y + '" width="' + b.w + '" height="' + b.h + '" fill="' + b.color + '" rx="2">';
    svg += '<title>' + b.week + ': ' + b.count + ' deeds</title>';
    svg += '</rect>';
    svg += '<text x="' + (b.x + b.w / 2) + '" y="' + (H - 8) + '" class="bar-label">' + (b.week ? b.week.slice(-5) : '') + '</text>';
  });

  svg += '</svg>';
  return svg;
}
</script>
</body>
</html>
