name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff==0.11.12

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Check Python syntax (all source files)
        run: |
          find . -name "*.py" \
            -not -path "./.kilo/*" \
            -not -path "./kilo_output/*" \
            -not -path "./kilo_logs/*" \
            -not -path "./.pytest_cache/*" \
            -not -path "./node_modules/*" \
            | xargs python -m py_compile

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          pip install \
            pytest>=7.0 pytest-mock>=3.0 pytest-cov>=4.0 \
            loguru python-dotenv \
            psycopg2-binary sqlalchemy alembic \
            "prometheus-client>=0.21.0" \
            redis requests \
            fastapi "slowapi>=0.1.9,<0.2.0" starlette httpx pandas geoalchemy2 shapely jinja2 tenacity \
            beautifulsoup4 lxml pyyaml pdfplumber "chromadb>=0.4.0"

      - name: Run unit tests
        env:
          DB_PASSWORD: test_password_for_ci
        run: |
          pytest tests/ -v -m "not integration and not slow" --tb=short \
            --cov=agents --cov=config --cov=crews --cov=scrapers --cov=utils --cov=dashboard \
            --cov-report=term-missing --cov-report=xml --cov-fail-under=50

      - name: Check no new skip/xfail without TRACK comment
        # Gate: any new pytest.mark.skip / skipif / xfail line must carry a
        # trailing ``# TRACK: <ticket-or-reason>`` comment.
        # Falls back to HEAD~1 when origin/master is unavailable (shallow clone,
        # detached HEAD, first commit).
        run: |
          BASE="origin/master"
          if ! git rev-parse --verify "$BASE" &>/dev/null; then
            BASE="HEAD~1"
            echo "warning: $BASE not found — using HEAD~1 as diff base"
          fi
          VIOLS=$(git diff "$BASE" -- tests/ 2>/dev/null \
            | grep '^+' \
            | grep -E 'pytest\.mark\.(skip|xfail)' \
            | grep -v '#\s*TRACK:' \
            || true)
          if [ -n "$VIOLS" ]; then
            echo "FAIL: New pytest.mark.skip or pytest.mark.xfail without # TRACK: comment"
            echo "Add a trailing comment:  # TRACK: <ticket-or-reason>"
            echo "$VIOLS"
            exit 1
          fi
          echo "No new untracked skips — clean"

      - name: Sprint 50 — HF Intelligence CI gate (finbert-tone + LegalDocQA)
        run: |
          echo "Running finbert-tone + LegalDocQA unit tests (mocked, no HF API)"
          python -m pytest tests/test_finbert_tone.py tests/test_legal_doc_qa.py tests/test_gate58.py -m "not integration" -v --tb=short

      - name: BERTScore regression check
        continue-on-error: true
        run: |
          if ! command -v bc &>/dev/null; then
            echo "bc not available — installing"
            sudo apt-get update -qq && sudo apt-get install -y -qq bc
          fi
          FILE="outputs/eval_scores.jsonl"
          if [ ! -f "$FILE" ]; then
            echo "No eval_scores.jsonl found — skipping regression check"
            exit 0
          fi
          COUNT=$(wc -l < "$FILE")
          if [ "$COUNT" -lt 2 ]; then
            echo "Only $COUNT entry found — need >=2 for regression check"
            exit 0
          fi
          LATEST=$(tail -1 "$FILE" | grep -o '"score": [0-9.]*' | head -1 | awk '{print $2}')
          PREV=$(tail -2 "$FILE" | head -1 | grep -o '"score": [0-9.]*' | head -1 | awk '{print $2}')
          if [ -z "$LATEST" ] || [ -z "$PREV" ]; then
            echo "Could not extract scores from eval_scores.jsonl"
            exit 0
          fi
          THRESHOLD=$(echo "$PREV - 0.05" | bc)
          if [ "$(echo "$LATEST >= $THRESHOLD" | bc)" -eq 1 ]; then
            echo "BERTScore OK: latest=$LATEST >= threshold=$THRESHOLD (previous=$PREV - 0.05)"
            exit 0
          else
            echo "BERTScore regression: latest=$LATEST < threshold=$THRESHOLD (previous=$PREV - 0.05)"
            exit 1
          fi

  api-spec-drift:
    name: API Spec Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          pip install fastapi "slowapi>=0.1.9,<0.2.0" starlette \
            prometheus-client sqlalchemy psycopg2-binary redis requests \
            httpx pandas geoalchemy2 shapely jinja2 tenacity \
            beautifulsoup4 lxml pyyaml pdfplumber python-dotenv

      - name: Export live spec and diff against committed
        shell: bash
        run: |
          set -euo pipefail
          TMP_SPEC=$(mktemp)
          python scripts/export_openapi.py --dry-run > "$TMP_SPEC"
          # Strip x-generated-at from both files, then diff
          python -c "
import json, sys
for path in sys.argv[1:]:
    data = json.load(open(path))
    data.pop('x-generated-at', None)
    json.dump(data, open(path + '.stripped', 'w'), indent=2, sort_keys=True)
" "$TMP_SPEC" docs/api-v1.json
          if ! diff -q "$TMP_SPEC.stripped" docs/api-v1.json.stripped > /dev/null 2>&1; then
            echo "::error::API spec drift detected — run 'make spec' and commit docs/api-v1.json"
            diff "$TMP_SPEC.stripped" docs/api-v1.json.stripped || true
            rm -f "$TMP_SPEC" "$TMP_SPEC.stripped" docs/api-v1.json.stripped
            exit 1
          fi
          rm -f "$TMP_SPEC" "$TMP_SPEC.stripped" docs/api-v1.json.stripped
          echo "API spec is in sync with committed docs/api-v1.json"

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: detect-secrets scan
        run: |
          pip install detect-secrets
          detect-secrets scan --baseline .secrets.baseline

  type-check:
    name: Static Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install mypy + stubs
        # types-* stubs improve type-checking for popular stdlib/third-party modules
        # that have mypy stubs available. When a new untyped dependency is added,
        # either pip install types-<pkg> or add [mypy-<pkg>.*] ignore to mypy.ini.
        run: pip install mypy types-requests types-redis types-beautifulsoup4

      - name: Run mypy (core modules)
        # CI uses --config-file mypy.ini which sets strict_optional + per-module ignores.
        # Do NOT add --no-strict-optional or --ignore-missing-imports (the two
        # flags removed in GATE-110) — they bypass mypy.ini config and undermine this gate.
        run: |
          mypy agents/ config/ crews/ utils/ intelligence/ ingest/ \
            --config-file mypy.ini

  sast:
    name: Static Security Analysis (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run Bandit — HIGH severity (blocking)
        # -lll -iii = HIGH severity + HIGH confidence only — genuine vulnerabilities
        # Medium-severity findings tracked in bandit-baseline.json (non-blocking)
        run: |
          bandit -r . -lll -iii \
            --exclude ./.kilo,./kilo_output,./kilo_logs,./tests,./scripts,./alembic \
            -f txt

      - name: Run Bandit — MEDIUM severity (vs baseline, informational)
        # Compares against committed baseline — only NEW medium findings appear in output
        # Update baseline: bandit -r . -ll -ii --exclude ... -f json -o bandit-baseline.json
        continue-on-error: true
        run: |
          if [ -f bandit-baseline.json ]; then
            bandit -r . -ll -ii \
              --exclude ./.kilo,./kilo_output,./kilo_logs,./tests,./scripts,./alembic \
              --baseline bandit-baseline.json \
              -f txt
          else
            echo "bandit-baseline.json not found — run: bandit -r . -ll -ii --exclude ./tests,./scripts,./alembic -f json -o bandit-baseline.json"
            bandit -r . -ll -ii \
              --exclude ./.kilo,./kilo_output,./kilo_logs,./tests,./scripts,./alembic \
              -f txt
          fi

  pip-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        # Known packaging conflict: crewai-tools==0.17.0 requires chromadb>=0.6.0 but
        # our pin caps at <0.6.0 (embedchain transitive dep). This is a resolution conflict,
        # NOT a CVE. We detect this case and exit 0; any actual CVE (PYSEC-*) still fails.
        # Fix track: T-AUDIT-CHROMADB (migrate embedder.py to chromadb 0.6.x API)
        run: |
          pip-audit -r requirements.txt 2>&1 | tee pip-audit.log; AUDIT_EXIT=$?
          if [ $AUDIT_EXIT -ne 0 ]; then
            if grep -q "ResolutionImpossible\|Could not install" pip-audit.log && \
               ! grep -qE "PYSEC-[0-9]|CVE-[0-9]" pip-audit.log; then
              echo "pip-audit: packaging conflict only (chromadb pin vs crewai-tools) — zero CVEs detected"
              exit 0
            fi
            echo "pip-audit: CVEs or unexpected errors found — review pip-audit.log"
            exit $AUDIT_EXIT
          fi

  docker-validate:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create stub .env from example
        run: |
          cp .env.example .env
          sed -i 's/your_secure_db_password_here/ci_stub_password/' .env
          sed -i 's/csk_your-key-here/csk_stubkey/' .env
          sed -i 's/gsk_your-key-here/gsk_stubkey/' .env
          sed -i 's/AIza_your-key-here/AIza_stubkey/' .env
          sed -i 's/nvapi-your-key-here/nvapi_stubkey/' .env
          sed -i 's/sk-or-v1-your-key-here/sk-or-v1-stubkey/' .env

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build . --tag re_os:ci --quiet

  schema-check:
    name: SQL Schema Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: re_os_test
          POSTGRES_USER: re_os_user
          POSTGRES_PASSWORD: re_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U re_os_user -d re_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get install -y postgresql-client

      - name: Apply schema to test database
        env:
          PGPASSWORD: re_os_test
        run: |
          psql -h localhost -U re_os_user -d re_os_test -f database/schema.sql
          echo "Schema applied successfully"

      - name: Alembic migration drift check
        env:
          DB_PASSWORD: re_os_test
          DATABASE_URL: postgresql://re_os_user:re_os_test@localhost:5432/re_os_test
        run: |
          pip install alembic>=1.13.0 psycopg2-binary sqlalchemy geoalchemy2
          # schema.sql was already applied above — stamp head so Alembic
          # knows the DB is at the latest revision without re-running migrations
          alembic stamp head
          echo "Schema stamped at head"
          # Verify single head (no branch divergence — target_metadata=None so alembic check is skipped)
          HEADS=$(alembic heads | wc -l)
          if [ "$HEADS" -ne 1 ]; then
            echo "FAIL: Expected 1 alembic head, got $HEADS"
            alembic heads
            exit 1
          fi
          echo "Single alembic head confirmed"

  integration-tests:
    name: Integration Tests (live Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: re_os_test
          POSTGRES_USER: re_os_user
          POSTGRES_PASSWORD: re_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U re_os_user -d re_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          sudo apt-get install -y postgresql-client
          pip install pytest>=7.0 pytest-mock>=3.0 coverage \
            loguru python-dotenv \
            psycopg2-binary sqlalchemy alembic \
            geoalchemy2 prometheus-client redis requests \
            fastapi "slowapi>=0.1.9,<0.2.0" starlette httpx pandas \
            shapely jinja2 tenacity pdfplumber

      - name: Apply schema + run migrations
        env:
          PGPASSWORD: re_os_test
          DB_PASSWORD: re_os_test
          DATABASE_URL: postgresql://re_os_user:re_os_test@localhost:5432/re_os_test
        run: |
          psql -h localhost -U re_os_user -d re_os_test -f database/schema.sql
          alembic stamp head

      - name: Run integration tests
        env:
          DB_PASSWORD: re_os_test
          TEST_DATABASE_URL: postgresql://re_os_user:re_os_test@localhost:5432/re_os_test
        run: |
          pytest tests/ -m integration -v --tb=short

  integrity-tests:
    name: DB Integrity Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: schema-check

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: re_os_test
          POSTGRES_USER: re_os_user
          POSTGRES_PASSWORD: re_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U re_os_user -d re_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install psql + test deps
        run: |
          sudo apt-get install -y postgresql-client
          pip install pytest>=7.0 loguru python-dotenv \
            psycopg2-binary sqlalchemy alembic \
            geoalchemy2 prometheus-client redis requests

      - name: Apply schema + run migrations
        env:
          PGPASSWORD: re_os_test
          DB_PASSWORD: re_os_test
          DATABASE_URL: postgresql://re_os_user:re_os_test@localhost:5432/re_os_test
        run: |
          psql -h localhost -U re_os_user -d re_os_test -f database/schema.sql
          alembic stamp head

      - name: Run data integrity checks
        env:
          DB_PASSWORD: re_os_test
          DATABASE_URL: postgresql://re_os_user:re_os_test@localhost:5432/re_os_test
        run: |
          pytest tests/test_data_integrity.py -m integration -v --tb=short

  repo-hygiene:
    name: Dev-file Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify no dev-only files in tracked tree
        run: |
          BLOCKED=(
            CLAUDE.md BRAIN_BRIEF.md AGENTS.md
            TASK_QUEUE.md TASK_BRIEFS.md TASK_ARCHIVE.md TODOS.md
            CURRENT_TASK.md DISPATCH.md GOVERNANCE.md REPLAN.md
            STRATEGY.md SUPPORT.md NEXT_TASKS.md BEGINNER_GUIDE.md
            .kilocoderules .clinerules
            KILO_BRIEF.md CLINE_BRIEF.md TOOL_GUIDE.md DEVLOG.md OPERATIONAL_REVIEW.md
          )
          FAILED=0
          for f in "${BLOCKED[@]}"; do
            if git ls-files --error-unmatch "$f" 2>/dev/null; then
              echo "BLOCKED: $f is tracked — dev files must not enter the product repo"
              FAILED=1
            fi
          done
          # Check for files that were moved to docs/ — must not re-appear at root
          for f in SETUP.md HOW_TO_RUN.md CONTRIBUTING.md SECURITY.md; do
            if git ls-files --error-unmatch "$f" 2>/dev/null; then
              echo "BLOCKED: $f belongs in docs/ not root"
              FAILED=1
            fi
          done
          # Check for dev directories
          for dir in "01 Daily" "plans" "kilo_logs" "kilo_output" ".compound-engineering" "test-results" "dbt"; do
            if git ls-files | grep -q "^${dir}/"; then
              echo "BLOCKED: ${dir}/ contains tracked files — dev directories must not enter the product repo"
              FAILED=1
            fi
          done
          if [ $FAILED -ne 0 ]; then
            echo ""
            echo "Run: git rm --cached <file> && git commit"
            exit 1
          fi
          echo "Clean — no dev files in tracked tree"
