[mypy]
strict_optional = True
warn_return_any = True
warn_unused_ignores = True
follow_imports = skip
exclude = tests/

# ── Maintenance Guide ──────────────────────────────────────────────────
# To add a new untyped third-party package:
#   1. Create [mypy-<pkg>.*] section below with ignore_missing_imports = True
#   2. List alphabetically by package name
#   3. Run: mypy agents/ config/ crews/ utils/ intelligence/ ingest/ --config-file mypy.ini
#   4. If the package now provides stubs (check typeshed / pip install types-<pkg>),
#      PREFER stubs over ignore_missing_imports — remove the section once stubs ship.
#
# Known untyped packages (checked 2026-06-17):

[mypy-apscheduler.*]
ignore_missing_imports = True

[mypy-chromadb.*]
# TODO-STUB: HIGH-risk — vector DB. Wrap calls via utils/embedder.py (IntelEmbedder).
ignore_missing_imports = True

[mypy-crewai.*]
ignore_missing_imports = True

[mypy-empyrical.*]
ignore_missing_imports = True

[mypy-esda.*]
ignore_missing_imports = True

[mypy-evaluate.*]
ignore_missing_imports = True

[mypy-fitz.*]
ignore_missing_imports = True

[mypy-geopandas.*]
ignore_missing_imports = True

[mypy-langchain.*]
ignore_missing_imports = True

[mypy-libpysal.*]
ignore_missing_imports = True

[mypy-networkx.*]
ignore_missing_imports = True

[mypy-numpy_financial.*]
ignore_missing_imports = True

[mypy-osmnx.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-pandana.*]
ignore_missing_imports = True

[mypy-pdfplumber.*]
