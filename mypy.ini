[mypy-psycopg2.*]
# TODO-STUB: HIGH-risk — DB driver. All DB access goes through utils/db.py.
ignore_missing_imports = True

[mypy-rouge_score.*]
ignore_missing_imports = True

[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-shapely.*]
